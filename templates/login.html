{% extends "base.html" %}

{% block title %}Sign in · Server Monitor{% endblock %}

{% block content %}
<section class="auth-panel">
  <p class="eyebrow">Admin access</p>
  <h1>Sign in</h1>
  <p class="lede">Use the shared demo account to view metrics and manage servers.</p>

  {% if error %}
    <div class="alert alert--error" role="alert">
      <span class="alert__title">Sign-in failed</span>
      {{ error }}
    </div>
  {% endif %}

  <form class="stack-form" method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
    <label>
      Username
      <input type="text" name="username" autocomplete="username" required autofocus
             value="{{ username or '' }}">
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn">Sign in</button>
  </form>
</section>
{% endblock %}
